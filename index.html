<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectra || Audio Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="artCanvas"></canvas>

  <button id="btnToggleMenu" class="mobile-toggle">≡ MENU</button>

  <aside id="sidebar" class="floating-dock">
    <div class="header">
      <h1><span>Spectra</span> || Audio Visualizer</h1>
    </div>

    <div class="control-group">
      <span class="section-title">Audio Source</span>
      <input type="file" id="audioUpload" accept="audio/*">
      
      <div class="transport-controls">
        <button id="btnPlay">PLAY</button>
        <button id="btnStop" class="active">STOP</button>
      </div>
    </div>

    <div class="control-group no-border">
      
      <div class="sub-group">
        <span class="sub-group-title">Appearance</span>
        <div class="color-controls">
          <div class="color-picker-wrapper">
            <label for="colorPrimary" class="control-label">Color 1</label>
            <input type="color" id="colorPrimary" value="#00f3ff">
          </div>
          <div class="color-picker-wrapper">
            <label for="colorSecondary" class="control-label">Color 2</label>
            <input type="color" id="colorSecondary" value="#ff00ff">
          </div>
        </div>
      </div>

      <div class="sub-group">
        <span class="sub-group-title">Dynamics</span>
        <div class="slider-container">
          <div class="slider-header">
            <label for="slScale">Amplitude Scale</label>
            <span class="slider-value">1.5</span>
          </div>
          <input type="range" id="slScale" min="0.5" max="4" step="0.1" value="1.5">
        </div>

        <div class="slider-container">
          <div class="slider-header">
            <label for="slSmoothing">Audio Smoothing</label>
            <span class="slider-value">0.85</span>
          </div>
          <input type="range" id="slSmoothing" min="0" max="0.99" step="0.01" value="0.85">
        </div>
      </div>
      
      <div class="sub-group">
        <span class="sub-group-title">Geometry</span>
        <div class="slider-container">
          <div class="slider-header">
            <label for="slRadius">Base Radius</label>
            <span class="slider-value">14%</span>
          </div>
          <input type="range" id="slRadius" min="5" max="40" step="1" value="15">
        </div>
        <div class="slider-container">
          <div class="slider-header">
            <label for="slThickness">Line Thickness</label>
            <span class="slider-value">3px</span>
          </div>
          <input type="range" id="slThickness" min="1" max="10" step="1" value="3">
        </div>

        <div class="slider-container">
          <div class="slider-header">
            <label for="slRotation">Rotation Speed</label>
            <span class="slider-value">0.0</span>
          </div>
          <input type="range" id="slRotation" min="0" max="5" step="0.1" value="0">
        </div>
      </div>

    </div>
  </aside>

  <div id="progressDock" class="floating-dock full-width-bottom">
    <span id="timeCurrent">0:00</span>
    <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
    <span id="timeTotal">0:00</span>
  </div>

  <div id="hudDock" class="floating-dock">
    <div class="status-bar" id="statusText">SYS: IDLE</div>
    <a href="https://kaithegreat-123.github.io/personal-website/" target="_blank" class="kai-link">-by kai</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
